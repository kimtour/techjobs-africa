name: M0 Source Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techjobs-m0-discovery
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install M0 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-m0.txt

      - name: Run M0 discovery probe
        env:
          CRAWLER_CONTACT_URL: ${{ vars.CRAWLER_CONTACT_URL }}
          CRAWLER_CONTACT_EMAIL: ${{ vars.CRAWLER_CONTACT_EMAIL }}
          M0_ENV: github-actions
        run: |
          python ingest/m0_probe.py

      - name: Upload M0 results
        uses: actions/upload-artifact@v4
        with:
          name: m0-discovery-results
          path: |
            docs/source-discovery.md
            m0-results.json
