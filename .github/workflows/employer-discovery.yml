name: Verify employer recruitment sources
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full-list probe, shortlisted discovery or isolated trial (never publishes)
        type: choice
        options: [probe, discover, trial]
        default: discover
      source:
        description: Optional single registry source ID; empty selects discovery shortlist or verified trial sources
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: employer-onboarding
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check out accepted data for trial comparison
        if: inputs.mode == 'trial'
        uses: ./.github/actions/checkout-data
        with:
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          repository: ${{ vars.DATA_REPOSITORY || 'kimtour/techkazi-data' }}
      - name: Run bounded source checks
        env:
          ONBOARDING_MODE: ${{ inputs.mode }}
          ONBOARDING_SOURCE: ${{ inputs.source }}
        run: |
          if [ "$ONBOARDING_MODE" = probe ]; then
            python -u -m ingest.employer_probe --output-dir /tmp/employer-onboarding
            exit 0
          fi
          ARGS=()
          if [ -n "$ONBOARDING_SOURCE" ]; then ARGS+=(--source "$ONBOARDING_SOURCE"); fi
          if [ "$ONBOARDING_MODE" = trial ]; then ARGS+=(--accepted .private-data/public/jobs.json); fi
          python -u -m ingest.employer_onboarding "$ONBOARDING_MODE" --output-dir /tmp/employer-onboarding "${ARGS[@]}"
      - name: Upload metadata and isolated candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employer-${{ inputs.mode }}-${{ github.run_id }}
          path: /tmp/employer-onboarding/
          retention-days: 7
          if-no-files-found: error
