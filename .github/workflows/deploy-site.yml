name: Deploy TechKazi site

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Serialize with ingestion so an older build cannot overwrite a newer one.
concurrency:
  group: techjobs-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-data
        with:
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          repository: ${{ vars.DATA_REPOSITORY || 'kimtour/techkazi-data' }}
      - name: Read the accepted job export
        run: cp .private-data/public/jobs.json site/src/data/jobs.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build current employer directory export
        run: |
          pip install -r requirements-dev.txt
          python -m ingest.employer_registry
      - name: Validate and build
        run: |
          npm ci --prefix site
          npm test --prefix site
          npm run check --prefix site
          npm run build --prefix site
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
