name: Ingest and build static site
run-name: 'Job fetch · ${{ inputs.scheduler_slot || github.run_id }}'

on:
  workflow_dispatch:
    inputs:
      source:
        description: Sources to fetch
        required: false
        default: all
        type: choice
        options: [all, jsearch, expertini, corporate_staffing, camunda, blacksmith, sdg]
      refresh_jsearch:
        description: Refresh changed Google queries today (still respects monthly quota)
        required: false
        default: false
        type: boolean
      scheduler_slot:
        description: Cloudflare scheduler slot (leave empty for a manual fetch)
        required: false
        default: ''
        type: string
  # Scheduled fetches are dispatched by the Cloudflare Worker; manual fetches
  # remain available above. Do not enable native cron alongside the Worker.

permissions:
  contents: write
  deployments: write

# All future workflows that write the data branch must share this group.
concurrency:
  group: techjobs-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_DIR: /tmp/techjobs-africa-data
      CANDIDATE_DIR: /tmp/techjobs-africa-candidate
    steps:
      - name: Check out application branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate ingestion code
        run: |
          pytest -q
          ruff check ingest tests

      - name: Prepare isolated candidate from saved data
        run: |
          git fetch origin data
          git worktree add "$DATA_DIR" origin/data

      - name: Claim scheduled fetch slot before contacting sources
        id: claim
        env:
          SCHEDULER_SLOT: ${{ inputs.scheduler_slot }}
        run: python -m ingest.claim_slot --data-dir "$DATA_DIR"

      - name: Copy candidate after recording scheduler claim
        if: steps.claim.outputs.proceed == 'true'
        run: |
          mkdir -p "$CANDIDATE_DIR"
          cp -R "$DATA_DIR/canonical" "$DATA_DIR/public" "$DATA_DIR/state" "$CANDIDATE_DIR/"

      - name: Ingest approved sources
        id: fetch
        if: steps.claim.outputs.proceed == 'true'
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          FETCH_SOURCE: ${{ inputs.source || 'all' }}
          REFRESH_JSEARCH: ${{ inputs.refresh_jsearch || 'false' }}
        run: |
          REFRESH_ARGS=()
          if [ "$REFRESH_JSEARCH" = "true" ]; then REFRESH_ARGS+=(--refresh-jsearch); fi
          if [ "$FETCH_SOURCE" != "all" ]; then
            python -u -m ingest.main --output-dir "$CANDIDATE_DIR" --source "$FETCH_SOURCE" "${REFRESH_ARGS[@]}"
          else
            python -u -m ingest.main --output-dir "$CANDIDATE_DIR" "${REFRESH_ARGS[@]}"
          fi

      - name: Set up Node
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.public_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build and validate changed candidate
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.public_changed == 'true'
        run: |
          cp "$CANDIDATE_DIR/public/jobs.json" site/src/data/jobs.json
          npm ci --prefix site
          npm test --prefix site
          npm run check --prefix site
          npm run build --prefix site

      - name: Upload deployable static site
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.public_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: techjobs-africa-static-site
          path: site/dist
          if-no-files-found: error

      - name: Check deployment configuration
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.public_changed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: test -n "$CF_API_TOKEN" && test -n "$CF_ACCOUNT_ID" && test -n "$CF_PROJECT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.public_changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize safe data and record publication outcome
        if: always() && steps.fetch.outcome != 'skipped'
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          PUBLISHABLE: ${{ steps.fetch.outputs.publishable }}
          PUBLIC_CHANGED: ${{ steps.fetch.outputs.public_changed }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOY_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: python -m ingest.finalize --data-dir "$DATA_DIR" --candidate-dir "$CANDIDATE_DIR"

      - name: Commit fetch audit and finalized data
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          if [ ! -d "$DATA_DIR/state" ]; then exit 0; fi
          git -C "$DATA_DIR" config user.name "github-actions[bot]"
          git -C "$DATA_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$DATA_DIR" add canonical public state
          if ! git -C "$DATA_DIR" diff --cached --quiet; then
            git -C "$DATA_DIR" commit -m "Record fetch audit and safe job state"
            git -C "$DATA_DIR" push origin HEAD:data
          fi

      - name: Upload fetch audit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/techjobs-africa-candidate/state/last-run.json
            /tmp/techjobs-africa-candidate/state/health.json
            /tmp/techjobs-africa-candidate/state/fetch-summary.md
            /tmp/techjobs-africa-candidate/state/fetch-progress.json
            /tmp/techjobs-africa-candidate/state/publication-history/
            /tmp/techjobs-africa-candidate/state/request-history/
          retention-days: 90
          if-no-files-found: warn

      - name: Fail visibly when no safe fetch could be published
        if: steps.fetch.outputs.publishable == 'false'
        run: |
          echo "::error::Fetch blocked by source failures or quality gates. See fetch audit."
          exit 1

      - name: Flag recurring source problems for attention
        if: steps.fetch.outputs.publishable == 'true' && steps.fetch.outputs.needs_attention == 'true'
        run: |
          echo "::error::A source has failed or remained incomplete for at least two consecutive runs. Safe updates were retained; inspect fetch audit."
          exit 1
