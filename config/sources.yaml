    method: no_supported_read_api
    production_method: null
    interval_hours: 3
    timezone: null
    crawl:
      max_pages: 0
      max_requests_per_run: 0
      recent_days: 30
      request_delay_ms: 0
      timeout_seconds: 15
      retry_delays_seconds: [5, 20, 60]
      complete_when: not_applicable
    closed_markers: []
    ttl_days: 30
    legal:
      robots_checked: false
      tos_checked: true
      permission: denied
      notes: "LinkedIn's User Agreement prohibits scraping, bots, and copying or distributing Service content without consent. Its Job Posting API is a partner posting API, not a general job-search read API. Disabled; reconsider only with a written LinkedIn agreement that permits this use."

