schema_version: 1

sources:
  - id: linkedin
    name: LinkedIn via JSearch
    enabled: true
    supports_absence_expiry: false
    discovery_url: "https://www.openwebninja.com/api/jsearch"
    method: documented_jsearch_api
    production_method: documented_jsearch_api
    interval_hours: 24
    timezone: UTC
    crawl:
      max_pages: 2
      max_requests_per_run: 2
      recent_days: 30
      request_delay_ms: 500
      timeout_seconds: 25
      retry_delays_seconds: []
      complete_when: both_bounded_queries_succeeded
    closed_markers: []
    ttl_days: 30
    legal:
      robots_checked: false
      tos_checked: true
      permission: user_authorized_via_jsearch
      notes: "User requested public LinkedIn-linked results via the configured JSearch API on 2026-10-01 after reviewing discovery results and usage-rights limitations. This does not establish a LinkedIn partnership or a provider redistribution license. No direct LinkedIn scraping or access-control bypass. Retain only minimal metadata and validated LinkedIn job links; never descriptions."

  - id: bebee
    name: beBee Kenya
    enabled: true
    supports_absence_expiry: false
    discovery_url: "https://bebee.com/ke/jobs/industry/technology"
    method: authorized_public_html
    production_method: authorized_public_html
    interval_hours: 24
    timezone: UTC
    crawl:
      max_pages: 10
      max_requests_per_run: 160
      request_delay_ms: 1500
      timeout_seconds: 25
      retry_delays_seconds: []
      complete_when: bounded_category_pages_succeeded
    closed_markers: []
    ttl_days: 30
    legal:
      robots_checked: true
      tos_checked: true
      permission: owner_authorized_by_phone
      notes: "On 2026-10-01 the user reported obtaining authorization from beBee by phone and requested ingestion from the supplied Kenya technology category. This authorization covers bounded public category pagination despite general robots restrictions. No internal API, login, proxy, or block bypass. Keep only minimal JobPosting metadata, require Kenya country evidence, and filter titles for technical roles. Attribute to beBee inside Other/Linkedin and All Jobs; do not claim LinkedIn origin."

  - id: myjobmag
    name: MyJobMag Kenya
    enabled: true
    discovery_url: "https://www.myjobmag.co.ke/jobs-by-field/information-technology"
    method: public_html_pagination
    production_method: public_html_pagination
    feed_url: "https://www.myjobmag.co.ke/jobsxml_by_categories.xml"
    interval_hours: 2
    timezone: Africa/Nairobi
    crawl:
      max_pages: 40
      max_requests_per_run: 60
      request_delay_ms: 1500
      timeout_seconds: 15
      retry_delays_seconds: [5, 20]
      complete_when: unknown
    closed_markers: []
    ttl_days: 30
    legal:
      robots_checked: true
      tos_checked: true
      permission: approved_by_source_owner
      notes: "Use the public IT category pagination for minimal, attributed link-out aggregation. Capture the most recent 30 days only; do not persist descriptions. The XML feed remains a fallback only."

  - id: corporate_staffing
    name: Corporate Staffing Kenya
    enabled: true
    discovery_url: "https://www.corporatestaffing.co.ke/category/it-jobs-in-kenya/"
    method: public_wordpress_json
    production_method: public_wordpress_json
    api_url: "https://www.corporatestaffing.co.ke/wp-json/wp/v2/job?categories=10"
    interval_hours: 2
    timezone: Africa/Nairobi
    crawl:
      max_pages: 25
      max_requests_per_run: 40
      request_delay_ms: 1500
      timeout_seconds: 15
      retry_delays_seconds: [5, 20]
      complete_when: unknown
    closed_markers: []
    ttl_days: 30
    legal:
      robots_checked: true
      tos_checked: true
      permission: approved_by_source_owner
      notes: "Source owner approved fair-use, attributed access through the public WordPress jobs endpoint. Do not persist descriptions."

  - id: brightermonday
    name: BrighterMonday Kenya
