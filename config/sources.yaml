      tos_checked: true
      permission: approved_by_source_owner
      notes: "Source owner granted fair-use, attributed access by phone on 2026-09-29. Cloudflare Bot Management returns HTTP 403 to HTTP/2 clients; plain HTTP/1.1 via the requests library reaches the Rails origin with a 200 and schema.org ItemList JSON embedded in the HTML. No descriptions, salary, or contacts persisted."

