    legal:
      robots_checked: true
      tos_checked: false
      permission: owner_authorized_in_writing
      notes: "On 2026-10-02 the user reported written permission, verified freshness, and requested replacement of beBee with Careerjet. Publisher XML feed or approved API access is pending. Public search requests currently return a verification page; do not bypass it. Enable production fetching only after the provided access method has been verified. Keep only minimal metadata and technical Kenya jobs, attributed to Careerjet in Other/Linkedin and All Jobs."

