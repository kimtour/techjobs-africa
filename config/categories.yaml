- Reject explicit non-technical job functions before applying technical keywords.
- Generic Product Manager roles are included under Technical Product by product decision.
- QA and test automation roles are included under QA / Testing.
- One role may have secondary categories.
context_rules:
- key: geospatial_application_development
  category: Data Engineering
  title_pattern: '\bearly warning expert\b'
  required_evidence:
  - '\b(geospatial|geo.application)\b'
  - '\b(Python|Node\.?js|Django|PostGIS)\b'
  - '\b(application development|backend development|developing REST APIs)\b'
- key: network_service_delivery
  category: Networking
  title_pattern: '\b(?:engineer service delivery|service delivery engineer)\b'
  required_evidence:
  - '\b(routing and switching|SDWAN|FTTB|FTTG)\b'
  - '\b(network|telecommunications|fiber)\b'
- key: digital_product_support
  category: Application Support
  title_pattern: '\bproduct analyst\b'
  required_evidence:
  - '\b(platform testing|platform health|bug triage|resolving bugs)\b'
  - '\b(digital product|live systems|software|engineering QA)\b'
- key: payments_platform_product
  category: Technical Product
  title_pattern: '\bhead of payments and platform\b'
  required_evidence:
  - '\bAPI\b'
  - '\bproduct specifications\b'
- key: digital_health_systems
  category: Technical Support
  title_pattern: '\bdigital health systems\b'
  required_evidence:
  - '\b(updates, configurations, and patches|systems and applications)\b'
  - '\b(troubleshooting|incident management|technical support)\b'
- key: software_application_development
  category: Software Engineering
  title_pattern: '\b(?:technical manager|associate principal engineer|lead automation engineer|senior quality engineer)\b'
  required_evidence:
  - '\b(software|SaaS|Python|JavaScript|TypeScript)\b'
  - '\b(develop(?:ment|ing)?|debug(?:ging)?|deploy(?:ment|ing)?|automated test(?:s|ing)|test automation|Playwright|Selenium|Cypress)\b'
- key: enterprise_systems_support
  category: Application Support
  title_pattern: '\b(?:group systems manager|information management assistant|PRIME system advisor|technical field support)\b'
  required_evidence:
  - '\b(ERP|Microsoft 365|IT infrastructure|software|business applications|hardware)\b'
  - '\b(troubleshoot(?:ing)?|configuration|technical support|system maintenance|systems support|IT support|deployment)\b'
- key: technical_engineering_management
  category: Technology Leadership
  title_pattern: '\btechnical manager\b'
  required_evidence:
  - '\bSQL Server\b'
